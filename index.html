<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miss Universe Santa Cruz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

background:#000;
color:white;
font-family:'Montserrat',sans-serif;

}

header{

position:fixed;
top:0;
left:0;

width:100%;

padding:25px 8%;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(0,0,0,.35);

backdrop-filter:blur(12px);

z-index:999;

}

.logo{

font-size:28px;

font-weight:300;

letter-spacing:8px;

color:#d4af37;

text-transform:uppercase;

}

nav{

display:flex;
gap:35px;

}

nav a{

color:white;

text-decoration:none;

font-size:14px;

letter-spacing:2px;

transition:.3s;

}

nav a:hover{

color:#d4af37;

}

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:40px;

background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.85));

}

.hero-content{

max-width:900px;

}

.hero h1{

font-size:68px;

font-weight:300;

letter-spacing:10px;

margin-bottom:20px;

}

.hero h2{

font-size:28px;

font-weight:300;

letter-spacing:7px;

margin-bottom:40px;

color:#d4af37;

}

.hero p{

font-size:18px;

line-height:1.8;

opacity:.9;

margin-bottom:45px;

}

.buttons{

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

}

.btn{

padding:16px 38px;

border:1px solid #d4af37;

color:white;

text-decoration:none;

letter-spacing:2px;

transition:.4s;

}

.btn:hover{

background:#d4af37;

color:black;

}

@media(max-width:850px){

nav{

display:none;

}

.logo{

font-size:18px;

letter-spacing:4px;

}

.hero h1{

font-size:40px;

}

.hero h2{

font-size:18px;

}

.hero p{

font-size:15px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

MISS ✴ UNIVERSE

</div>

<nav>

<a href="#">Inicio</a>

<a href="#">Nuestra Reina</a>

<a href="#">Organización</a>

<a href="#">Edición 2026</a>

<a href="#">Galería</a>

<a href="#">Noticias</a>

<a href="#">Contacto</a>

</nav>

</header>

<section class="hero">

<div class="hero-content">

  <h1>MISS <img src="Estrella.png%20.PNG" alt="Star" style="height:0.8em;vertical-align:middle;"> UNIVERSE</h1>

<h2>SANTA CRUZ DE TENERIFE</h2>

<p>

La organización oficial de Miss Universe Santa Cruz de Tenerife.

Elegancia, liderazgo y excelencia.

</p>

<div class="buttons">

<a href="#" class="btn">

NUESTRA REINA

</a>

<a href="#" class="btn">

LA ORGANIZACIÓN

</a>

</div>

</div>

</section>

</body>

</html>
