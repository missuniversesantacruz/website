name: Desbloquear GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: write
  pages: write
  contents: read

jobs:
  desbloquear:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar y forzar cancelación del workflow 94
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            const stuckRun = runs.find(run => run.run_number === 94);

            if (!stuckRun) {
              core.info("No se encontró el workflow #94.");
            } else {
              core.info(
                `Workflow #94 encontrado. ID interno: ${stuckRun.id}, estado: ${stuckRun.status}`
              );

              try {
                await github.request(
                  "POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel",
                  {
                    owner,
                    repo,
                    run_id: stuckRun.id
                  }
                );

                core.info("Cancelación forzada enviada correctamente.");
              } catch (error) {
                core.warning(
                  `No se pudo forzar la cancelación del workflow: ${error.message}`
                );
              }
            }

      - name: Cancelar el despliegue bloqueado de Pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                {
                  owner,
                  repo,
                  pages_deployment_id:
                    "b3953c11d1fb06815345e5f41c316337bf3af3fe"
                }
              );

              core.info("Despliegue bloqueado de Pages cancelado.");
            } catch (error) {
              core.warning(
                `No se pudo cancelar el despliegue de Pages: ${error.message}`
              );
            }
